name: Publish chemistry site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Restore verified site
        run: |
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          release = json.loads(Path('release.json').read_text())
          with open('site.zip', 'wb') as output:
              for part in release['parts']:
                  output.write(Path(part).read_bytes())
          assert hashlib.sha256(Path('site.zip').read_bytes()).hexdigest() == release['sha256'], 'Archive checksum mismatch'
          with zipfile.ZipFile('site.zip') as archive:
              archive.extractall('_site')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
